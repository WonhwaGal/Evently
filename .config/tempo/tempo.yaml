server:
  http_listen_port: 3200        # Tempo HTTP API (Grafana обращается сюда)
  grpc_listen_port: 9095        # Внутренний gRPC Tempo, не для OTLP

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317   # стандартный OTLP gRPC-порт
        http:
          endpoint: 0.0.0.0:4318   # стандартный OTLP HTTP-порт

ingester:
  lifecycler:
    ring:
      kvstore:
        store: memberlist

compactor:
  compaction:
    block_retention: 720h
    compacted_block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces