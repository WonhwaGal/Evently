receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  
  
exporters:
  otlphttp/seq:
    endpoint: http://evently.seq:5341/ingest/otlp
  otlphttp:
    endpoint: http://evently.loki:3100/otlp
  
  
service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [otlphttp/seq, otlphttp]